name: CI Gate & Deploy Backend to Hugging Face

on:
  push:
    branches:
      - main
      - mlops/*
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Automated CI Tests Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --default-timeout=1000 --find-links https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r backend/requirements.txt
          pip install pytest pytest-mock

      - name: Run Pytest CI Test Suite
        env:
          PYTHONPATH: backend
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          SECRET_KEY: "ci-secret-key-at-least-32-chars-long"
          GROQ_API_KEY: "ci_mock_groq_api_key"
        run: |
          pytest backend/tests/test_ci_pipeline.py backend/tests/test_health_ready.py backend/tests/test_metrics_logging.py -v

  deploy-hf:
    name: Deploy to Hugging Face Space
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://oauth2:${HF_TOKEN}@huggingface.co/spaces/samirk10/medical-ai-backend hf-space

      - name: Sync Backend Files
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='uploads' \
            --exclude='vector_stores' \
            backend/ hf-space/

      - name: Commit and Push to HF
        run: |
          cd hf-space

          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

          git add .

          git diff --cached --quiet || git commit -m "Auto deploy from GitHub (CI Passed)"

          git push